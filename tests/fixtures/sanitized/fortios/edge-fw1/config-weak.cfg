#config-version=FGT60F-7.2.8-FW-build1639-240313:opmode=0:vdom=0
# Hand-built, masked config for the lab firewall edge-fw1, weakened: fails the checks.
config system global
    set hostname "edge-fw1"
end
config system interface
    edit "wan1"
        set ip 198.51.100.2 255.255.255.252
        set allowaccess ping http
    next
    edit "internal"
        set ip 192.0.2.1 255.255.255.0
        set allowaccess ping https ssh http telnet snmp
    next
end
config system ntp
    set ntpsync disable
end
config system snmp sysinfo
    set status enable
end
config system snmp community
    edit 1
        set name <masked:k1:0f1e2d3c4b5a6978:weak>
        config hosts
            edit 1
                set ip 192.0.2.50 255.255.255.255
            next
        end
    next
end
config system snmp user
    edit "legacy"
        set security-level no-auth-no-priv
    next
end
