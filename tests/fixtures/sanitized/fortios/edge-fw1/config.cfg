#config-version=FGT60F-7.2.8-FW-build1639-240313:opmode=0:vdom=0
# Hand-built, masked config for the lab firewall edge-fw1. Hardened: passes the checks.
config system global
    set hostname "edge-fw1"
    set admin-https-redirect enable
end
config system interface
    edit "wan1"
        set ip 198.51.100.2 255.255.255.252
        set allowaccess ping
    next
    edit "internal"
        set ip 192.0.2.1 255.255.255.0
        set allowaccess ping https ssh snmp
    next
end
config system ntp
    set ntpsync enable
    set type custom
    config ntpserver
        edit 1
            set server "192.0.2.10"
        next
        edit 2
            set server "192.0.2.11"
        next
    end
end
config system snmp sysinfo
    set status enable
end
config system snmp user
    edit "poller"
        set notify-hosts 192.0.2.50
        set security-level auth-priv
        set auth-proto sha256
        set auth-pwd ENC <masked:k1:5e4d3c2b1a098877>
        set priv-proto aes256
        set priv-pwd ENC <masked:k1:6655443322110099>
    next
end
config log syslogd setting
    set status enable
    set server "192.0.2.20"
end
