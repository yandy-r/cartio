! Hand-built, masked running config for the lab switch core-sw1. Hardened: passes the checks.
version 17.9
hostname core-sw1
!
enable secret 9 <masked:k1:3fa1c0de5b7a9e21>
username netops privilege 15 secret 9 <masked:k1:9b2e4f6a1c3d5e70>
!
no ip http server
ip http secure-server
ip ssh version 2
!
ip access-list standard SNMP-POLLERS
 permit 192.0.2.50
!
snmp-server group MONITOR v3 priv
snmp-server user poller MONITOR v3 auth sha <masked:k1:1d2c3b4a59687706> priv aes 128 <masked:k1:a0b1c2d3e4f50617>
snmp-server host 192.0.2.50 version 3 priv poller
!
ntp server 192.0.2.10
ntp server 192.0.2.11 prefer
!
logging buffered 64000
logging trap informational
logging host 192.0.2.20
!
line con 0
 exec-timeout 5 0
line vty 0 4
 transport input ssh
line vty 5 15
 transport input ssh
!
end
