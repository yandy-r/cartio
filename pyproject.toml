[project]
name = "cartio-workspace"
version = "0.0.0"
description = "Cartio monorepo: shared core, collector and controller."
requires-python = ">=3.12"
dependencies = [
    "cartio-core",
    "cartio-collector",
    "cartio-controller",
]

[dependency-groups]
dev = [
    "pytest>=9.1",
    "pytest-django>=4.14",
    "ruff>=0.17",
]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["packages/*"]

[tool.uv.sources]
cartio-core = { workspace = true }
cartio-collector = { workspace = true }
cartio-controller = { workspace = true }

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "tests.settings"
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
# Django writes migrations; .claude holds skills vendored from ystack. Keep both as shipped.
extend-exclude = ["**/migrations/**", ".claude/**"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106"]
