[project]
name = "cartio-collector"
version = "0.1.0"
description = "Cartio collector: runs inside a customer network and dials out to the controller."
requires-python = ">=3.12"
dependencies = [
    "cartio-core",
    "cryptography>=46",
    "httpx>=0.28",
    "platformdirs>=4.13",
    "psycopg[binary]>=3.3",
    "scrapli[paramiko]>=2025.1.30,<2026",
    "truststore>=0.10",
]

[project.scripts]
cartio-collector = "cartio_collector.cli:main"

[tool.uv.sources]
cartio-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cartio_collector"]
