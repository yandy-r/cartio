# End-of-life and end-of-support dates for the eol-eos check (YAN-1665).
#
# To update: change or add an entry, set `checked` to the day you read the source, and bump
# `version` at the top. Every entry names where its dates came from. Prefer the vendor's own
# notice; when only a third-party tracker had the dates, `source` says so, and the dates should
# be confirmed against the vendor before a report relies on them.
#
# Dates:
#   end_of_sale            last day to order. Shown in evidence only.
#   end_of_security_fixes  no more vulnerability fixes after this. Past it, the check fails.
#   last_date_of_support   no support of any kind after this. Past it, the check fails.
# An entry with no dates means no end of life had been announced when it was checked.
#
# Hardware entries match the device's model, with * as a wildcard and case ignored. Software
# entries match the platform and the release train: "17.9" for IOS-XE 17.9.4a or 17.09.04a,
# "7.2" for FortiOS 7.2.8, and "15.2(7)E" for IOS 15.2(7)E8.

version = "2026-10-28"

[[hardware]]
manufacturer = "Cisco"
models = ["WS-C2960X-*"]
end_of_sale = 2022-10-31
last_date_of_support = 2027-10-31
source = "https://www.cisco.com/c/en/us/products/collateral/switches/catalyst-2960-x-series-switches/eos-eol-notice-c51-744432.html"
checked = 2026-10-28

