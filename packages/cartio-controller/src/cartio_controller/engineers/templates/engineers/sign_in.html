{% extends "engineers/base.html" %}
{% block title %}Sign in{% endblock %}
{% block signed_out %}
<div class="sign-in">
  <h1>Sign in to Cartio</h1>
  {% if error %}<p class="error">{{ error }}</p>{% endif %}
  {% if form.non_field_errors %}<p class="error">{{ form.non_field_errors|join:" " }}</p>{% endif %}
  <form method="post">
    {% csrf_token %}
    <input type="hidden" name="next" value="{{ next }}">
    <label for="id_username">Username</label>
    <input id="id_username" name="username" autocomplete="username" required autofocus
           value="{{ form.username.value|default_if_none:'' }}">
    <label for="id_password">Password</label>
    <input id="id_password" name="password" type="password" autocomplete="current-password" required>
    <button class="btn primary" type="submit">Continue</button>
  </form>
</div>
{% endblock %}
