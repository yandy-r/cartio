{% extends "engineers/base.html" %}
{% block title %}Enter your code{% endblock %}
{% block signed_out %}
<div class="sign-in">
  <h1>Enter your code</h1>
  <p class="muted">Open your authenticator app and enter the 6-digit code for Cartio.</p>
  {% if error %}<p class="error">{{ error }}</p>{% endif %}
  <form method="post">
    {% csrf_token %}
    <label for="id_code">Code</label>
    <input id="id_code" name="code" inputmode="numeric" autocomplete="one-time-code"
           pattern="[0-9 ]*" maxlength="8" required autofocus>
    <button class="btn primary" type="submit">Sign in</button>
  </form>
  <p><a href="{% url 'engineers:sign-in' %}">Start over</a></p>
</div>
{% endblock %}
