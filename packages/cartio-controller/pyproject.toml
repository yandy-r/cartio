[project]
name = "cartio-controller"
version = "0.1.0"
description = "Cartio controller: the one central service engineers and collectors connect to."
requires-python = ">=3.12"
dependencies = [
    "cartio-core",
    "django>=6.1,<6.2",
    "dj-database-url>=3.1",
    "psycopg[binary]>=3.3",
    "djangorestframework>=3.18,<3.19",
    "cryptography>=46",
    "reportlab>=4.4,<6",
    "pillow>=11",
    "gunicorn>=23",
]

[project.scripts]
cartio-controller = "cartio_controller.manage:main"

[tool.uv.sources]
cartio-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cartio_controller"]
