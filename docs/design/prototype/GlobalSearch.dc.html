<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Cartio · Global search</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&amp;family=IBM+Plex+Sans:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
.gs-trigger{display:flex;align-items:center;gap:10px;width:100%;border:1px solid #1F3A50;background:#13222F;color:#C9D4DE;border-radius:10px;padding:0 10px 0 12px;font:inherit;font-size:14px;cursor:pointer;min-height:44px;box-sizing:border-box;text-align:left}
.gs-trigger:hover{border-color:#2B4A63;color:#FFFFFF}
.gs-kbd{font-family:'IBM Plex Mono',ui-monospace,monospace;font-size:11px;border:1px solid #2B4A63;border-radius:5px;padding:1px 6px;color:#8FA3B5}
.gs-row{display:flex;gap:12px;align-items:center;padding:9px 12px;border-radius:10px;text-decoration:none;color:#101828;min-height:44px;box-sizing:border-box}
.gs-row:hover{background:#F3F5F7}
.gs-row.on{background:#ECFEFF;box-shadow:inset 3px 0 0 #0E7490}
.gs-mono{font-family:'IBM Plex Mono',ui-monospace,monospace}
.gs-scope{border:1px solid #D0D5DD;background:#FFFFFF;font:inherit;font-size:12px;padding:4px 10px;border-radius:999px;color:#344054;cursor:pointer;min-height:30px}
.gs-scope.on{background:#0E1A24;border-color:#0E1A24;color:#FFFFFF}
.gs-dialog{width:min(760px,100%);max-height:min(640px,100%)}
@media (max-width:720px){.gs-overlay{padding:0 !important}.gs-dialog{width:100%;max-height:100%;height:100%;border-radius:0 !important}}
</style>
</helmet>
<div style="width: 100%; font-family: 'IBM Plex Sans', system-ui, sans-serif; margin-bottom: 10px">
<button type="button" class="gs-trigger" aria-haspopup="dialog" aria-keyshortcuts="Control+K Meta+K" onClick="{{openIt}}">
<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-3.5-3.5"></path></svg>
<span style="flex: 1">Search…</span><span class="gs-kbd">{{kbd}}</span>
</button>

<sc-if value="{{open}}" hint-placeholder-val="{{ false }}">
<div class="gs-overlay" onClick="{{bgClose}}" style="position: fixed; inset: 0; z-index: 1100; background: rgba(14,26,36,.5); display: flex; align-items: flex-start; justify-content: center; padding: 10vh 16px 16px; box-sizing: border-box; color: #101828">
<section role="dialog" aria-modal="true" aria-label="Search Cartio" class="gs-dialog" onKeyDown="{{onKey}}" style="background: #FFFFFF; border-radius: 14px; box-shadow: 0 24px 64px rgba(14,26,36,.4); display: flex; flex-direction: column; overflow: hidden">
<div style="display: flex; align-items: center; gap: 10px; padding: 12px 14px; border-bottom: 1px solid #E4E8EC">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#475467" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-3.5-3.5"></path></svg>
<label for="gs-input" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Search devices, customers, findings and more</label>
<input id="gs-input" ref="{{inputRef}}" type="text" autocomplete="off" role="combobox" aria-expanded="true" aria-controls="gs-results" aria-activedescendant="{{activeId}}" value="{{q}}" onInput="{{onInput}}" placeholder="Search hostname, IP, serial, model, customer, finding…" style="flex: 1; border: 0; outline: none; font: inherit; font-size: 16px; min-height: 40px; background: transparent; color: #101828">
<span class="gs-kbd" style="border-color: #D0D5DD; color: #475467">esc</span>
</div>
<div style="display: flex; gap: 6px; align-items: center; padding: 8px 14px; border-bottom: 1px solid #EEF2F6; flex-wrap: wrap">
<span style="font-size: 12px; color: #475467">Search in</span>
<button type="button" class="{{scopeAllCls}}" aria-pressed="{{scopeAllPressed}}" onClick="{{scopeAll}}">All customers</button>
<button type="button" class="{{scopeOneCls}}" aria-pressed="{{scopeOnePressed}}" onClick="{{scopeOne}}">{{curName}}</button>
<span style="flex: 1"></span>
<span style="font-size: 12px; color: #475467">{{countText}}</span>
</div>
<div id="gs-results" role="listbox" aria-label="Results" style="overflow-y: auto; padding: 6px 8px 10px; flex: 1; min-height: 0">
<sc-for list="{{groups}}" as="g" hint-placeholder-count="3">
<div role="group" aria-label="{{g.name}}">
<div style="font-size: 11px; text-transform: uppercase; letter-spacing: .07em; color: #475467; padding: 10px 12px 4px; display: flex; justify-content: space-between"><span>{{g.name}}</span><span>{{g.more}}</span></div>
<sc-for list="{{g.items}}" as="r" hint-placeholder-count="3">
<a id="{{r.domId}}" role="option" aria-selected="{{r.selected}}" class="{{r.cls}}" href="{{r.href}}" ref="{{r.ref}}" onClick="{{r.go}}" onMouseEnter="{{r.hover}}">
<span style="width: 32px; height: 32px; border-radius: 8px; background: {{r.iconBg}}; color: {{r.iconFg}}; display: flex; align-items: center; justify-content: center; flex: none"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{r.icon}}"></path></svg></span>
<span style="flex: 1; min-width: 0"><span class="{{r.titleCls}}" style="display: block; font-size: 14px; font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap">{{r.title}}</span><span style="display: block; font-size: 12px; color: #475467; overflow: hidden; text-overflow: ellipsis; white-space: nowrap">{{r.sub}}</span></span>
<sc-if value="{{r.tag}}" hint-placeholder-val="{{ false }}"><span style="font-size: 11px; font-weight: 600; padding: 2px 8px; border-radius: 999px; background: {{r.tagBg}}; color: {{r.tagFg}}; flex: none">{{r.tag}}</span></sc-if>
<span style="font-size: 12px; color: #475467; flex: none; width: 92px; text-align: right">{{r.target}}</span>
</a>
</sc-for>
</div>
</sc-for>
<sc-if value="{{empty}}" hint-placeholder-val="{{ false }}">
<div style="padding: 28px 16px; text-align: center; color: #475467; font-size: 14px">No matches for “{{q}}”. Try a hostname, an IP address, a serial or a customer name.</div>
</sc-if>
<sc-if value="{{hasNote}}" hint-placeholder-val="{{ false }}">
<div style="margin: 8px 12px 0; font-size: 12px; color: #5B21B6; background: #F5F3FF; border-radius: 8px; padding: 8px 10px">{{note}}</div>
</sc-if>
</div>
<div style="display: flex; gap: 16px; flex-wrap: wrap; padding: 8px 14px; border-top: 1px solid #E4E8EC; font-size: 12px; color: #475467">
<span><span class="gs-kbd" style="border-color: #D0D5DD; color: #475467">↑</span> <span class="gs-kbd" style="border-color: #D0D5DD; color: #475467">↓</span> move</span>
<span><span class="gs-kbd" style="border-color: #D0D5DD; color: #475467">↵</span> open</span>
<span><span class="gs-kbd" style="border-color: #D0D5DD; color: #475467">esc</span> close</span>
<span style="flex: 1"></span><span>{{kbd}} opens search from anywhere on the page</span>
</div>
</section>
</div>
</sc-if>
</div>
</x-dc>

        tag: d[7] === 'Pending discovery' ? 'from ' + d[8] : d[7] === 'End of support' || d[7] === 'Drift' ? d[7] : d[0] === 'bp' ? 'live view' : '', tagBg: d[7] === 'Pending discovery' ? '#E0F2FE' : d[7] === 'End of support' ? '#FEE4E2' : d[7] === 'Drift' ? '#FFEDD5' : '#EDE9FE', tagFg: d[7] === 'Pending discovery' ? '#075985' : d[7] === 'End of support' ? '#912018' : d[7] === 'Drift' ? '#9A3412' : '#5B21B6',
        go: setCtx(d[0], null, { page: 'inventory', query: d[1] }) })), 8);
      push('Findings', IDX.find.filter((f) => inScope(f[0]) && hit(f[3] + ' ' + f[4] + ' ' + f[5] + ' ' + f[2])).map((f) => ({ title: f[3], sub: CUST[f[0]][0] + ' · ' + f[4] + ' · ' + f[5], href: 'Findings.dc.html', icon: IC.find, iconBg: SEV[f[2]][0], iconFg: SEV[f[2]][1], tag: f[2], tagBg: SEV[f[2]][0], tagFg: SEV[f[2]][1], target: 'Findings', go: setCtx(f[0], null, { page: 'findings', fid: f[1] }) })), 6);
      push('Collectors', COL.filter((c) => inScope(c[0]) && hit(c[1] + ' ' + c[2] + ' ' + c[3] + ' ' + CUST[c[0]][0])).map((c) => ({ title: c[1], titleCls: 'gs-mono', sub: CUST[c[0]][0] + ' · ' + c[2], href: 'Collectors.dc.html', icon: IC.col, iconBg: '#F3F5F7', iconFg: '#344054', tag: c[3], tagBg: c[3] === 'Online' ? '#DCFCE7' : c[3] === 'Offline' ? '#EEF2F6' : '#FEF3C7', tagFg: c[3] === 'Online' ? '#166534' : c[3] === 'Offline' ? '#344054' : '#854D0E', target: 'Collectors', go: setCtx(c[0]) })), 5);
      push('Engagements', ENG.filter((e) => inScope(e[0]) && hit(e[2] + ' ' + e[3] + ' ' + CUST[e[0]][0])).map((e) => ({ title: e[2], sub: CUST[e[0]][0] + ' · ' + e[3], href: 'Report.dc.html', icon: IC.eng, iconBg: '#F3F5F7', iconFg: '#344054', target: 'Report', go: setCtx(e[0], e[1]) })), 5);
      push('Integrations', INTG.filter((i) => inScope(i[0]) && hit(i[1] + ' ' + i[2] + ' ' + CUST[i[0]][0])).map((i) => ({ title: i[1], sub: CUST[i[0]][0] + ' · ' + i[2], href: 'Integrations.dc.html', icon: IC.intg, iconBg: '#F3F5F7', iconFg: '#344054', target: 'Integrations', go: setCtx(i[0]) })), 5);
      push('Pages and actions', PAGES.filter((p) => hit(p[0] + ' ' + p[2])).map(([t, href, sub, icon]) => ({ title: t, sub, href, icon, iconBg: '#F3F5F7', iconFg: '#344054', target: 'Page', go: setCtx(ctx.cust, ctx.eng) })), 5);
    }
    let n = 0;
    const flat = [];
    const groups = G.map((g) => ({ name: g.name, more: g.total > g.items.length ? g.items.length + ' of ' + g.total : '', items: g.items.map((r) => {
      const i = n++; flat.push(r);
      return { ...r, titleCls: r.titleCls || '', tag: r.tag || '', domId: 'gs-opt-' + i, selected: i === s.active ? 'true' : 'false', cls: i === s.active ? 'gs-row on' : 'gs-row',
        ref: (el) => { this.anchors[i] = el; }, hover: () => { if (s.active !== i) this.setState({ active: i }); } };
    }) }));
    const omHit = terms.length && s.scope === 'all' && terms.some((t) => 'ostrander om-'.indexOf(t) >= 0 || /^om/.test(t));
    const isMac = (() => { try { return /Mac|iPhone|iPad/.test(window.navigator.platform || ''); } catch (e) { return false; } })();
    return {
      open: s.open, q: s.q, kbd: isMac ? '⌘K' : 'Ctrl K',
      openIt: () => this.setState({ open: true, q: '', active: 0 }),
      bgClose: (e) => { if (e.target === e.currentTarget) this.setState({ open: false }); },
      inputRef: this.inputRef,
      onInput: (e) => this.setState({ q: e.target.value, active: 0 }),
      onKey: (e) => {
        if (e.key === 'Escape') { e.preventDefault(); this.setState({ open: false }); }
        else if (e.key === 'ArrowDown') { e.preventDefault(); this.setState({ active: Math.min(flat.length - 1, s.active + 1) }); }
        else if (e.key === 'ArrowUp') { e.preventDefault(); this.setState({ active: Math.max(0, s.active - 1) }); }
        else if (e.key === 'Enter') { e.preventDefault(); const a = this.anchors[s.active]; if (a && a.click) a.click(); }
      },
      activeId: flat.length ? 'gs-opt-' + Math.min(s.active, flat.length - 1) : '',
      groups, empty: terms.length > 0 && flat.length === 0,
      countText: terms.length ? flat.length + (flat.length === 1 ? ' result' : ' results') : 'Type to search',
      curName: 'Only ' + CUST[ctx.cust in CUST ? ctx.cust : 'nw'][0],
      scopeAllCls: s.scope === 'all' ? 'gs-scope on' : 'gs-scope', scopeOneCls: s.scope === 'one' ? 'gs-scope on' : 'gs-scope',
      scopeAllPressed: s.scope === 'all' ? 'true' : 'false', scopeOnePressed: s.scope === 'one' ? 'true' : 'false',
      scopeAll: () => this.setState({ scope: 'all', active: 0 }), scopeOne: () => this.setState({ scope: 'one', active: 0 }),
      hasNote: !!(omHit || (terms.length && s.scope === 'all')), note: omHit ? 'Ostrander Manufacturing keeps its data on site with inside access only, so its devices and findings are not searchable here.' : 'Bluepeak results come through live view and are not stored on the controller. Ostrander’s data is inside access only and not searchable here.',
    };
  }
}
